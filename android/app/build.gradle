plugins { id 'com.android.application' }

android {
    namespace 'top.emiraen.stronghold'
    compileSdk 35
    defaultConfig {
        applicationId 'top.emiraen.stronghold'
        minSdk 21
        targetSdk 35
        versionCode 2026102501
        versionName '0.2.1-Emi41-20261025'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
    }
    buildTypes { release { minifyEnabled false; shrinkResources false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = true }; resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:143.0.20251003115653'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
